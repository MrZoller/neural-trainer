[project]
name = "neural-trainer-backend"
version = "0.1.0"
description = "neural-trainer backend — FastAPI + PyTorch training server"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "torch>=2.4",
    "torchvision>=0.19",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
